name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:
    inputs:
      RUN_CD:
        description: 'Ejecutar CD (despliegue)?'
        type: boolean
        default: false
      DEPLOY_ENV:
        description: 'Entorno de despliegue'
        type: choice
        options:
          - DEV
          - PRO
        default: DEV

env:
  IMAGE_NAME: devops-python-app
  APP_URL: http://localhost:5000

jobs:
  ci:
    runs-on: ubuntu-latest
    container:
      image: python:3.6-slim
    env:
      APP_URL: http://localhost:5001
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Información del entorno
        run: |
          echo "Rama: ${{ github.ref_name }}"
          echo "SHA del commit: ${{ github.sha }}"
          echo "Sistema operativo del runner: ${{ runner.os }}"
          echo "Nombre del runner: ${{ runner.name }}"
          echo "RUN_CD: ${{ inputs.RUN_CD }}"
          echo "DEPLOY_ENV: ${{ inputs.DEPLOY_ENV }}"
          echo "IMAGE_NAME: ${{ env.IMAGE_NAME }}"
          echo "APP_URL (sobreescrita en job): ${{ env.APP_URL }}"

      - name: Mostrar variables y secretos
        run: |
          echo "Registry: ${{ vars.REGISTRY_HOST }}"
          echo "Artifactory: ${{ vars.ARTIFACTORY_URL }}"
          echo "Registry user: ${{ secrets.REGISTRY_USER }}"
          echo "Registry password: ${{ secrets.REGISTRY_PASSWORD }}"

      - name: Instalar dependencias y ejecutar tests
        run: |
          pip install -r requirements.txt
          pytest -q

  docker-build:
    runs-on: [self-hosted, linux, docker]
    needs: ci
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: |
          docker build -t ${{ env.IMAGE_NAME }} -f Dockerfile .
          echo "Imagen ${{ env.IMAGE_NAME }} construida correctamente"

  cd:
    runs-on: ubuntu-latest
    needs: docker-build
    if: |
      (github.ref_name == 'develop' || github.ref_name == 'master') &&
      inputs.RUN_CD == true
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Desplegar con Docker Compose
        run: |
          docker compose -f docker-compose.yml up -d
          sleep 20
          docker compose -f docker-compose.yml exec -T app curl -f http://localhost:5000/ || true

      - name: Limpieza siempre
        if: always()
        run: docker compose -f docker-compose.yml down --volumes