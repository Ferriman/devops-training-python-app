name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:
    inputs:
      RUN_CD:
        description: 'Ejecutar CD (despliegue)?'
        type: boolean
        default: false
      DEPLOY_ENV:
        description: 'Entorno de despliegue'
        type: choice
        options:
          - DEV
          - PRO
        default: DEV

jobs:
  dummy:
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar contexto
        run: |
          echo "Repo: $GITHUB_REPOSITORY"
          echo "Ref:  $GITHUB_REF"
          echo "Branch: $GITHUB_REF_NAME"